name: Release
# Builds the three distribution flavors and publishes them to the GitHub Release
# for the version in FluentLegionToolbar.csproj (<Version>). Runs after every push
# to main that changes code (README/docs-only pushes are skipped), or manually.
# Releases are immutable: existing versions/tags are never deleted or overwritten.
# New version: bump <Version> in the csproj and a new release is created.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      replace_v037:
        description: 'Owner-requested 0.3.7 restoration and safe reorder replacement'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content FluentLegionToolbar.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if(-not $v) { throw 'Version not found in FluentLegionToolbar.csproj' }
          "version=$v" >> $env:GITHUB_OUTPUT
          (Get-Content installer.iss) -replace '#define AppVersion ".*"', "#define AppVersion `"$v`"" | Set-Content installer.iss
      - name: Publish framework-dependent and self-contained builds
        shell: pwsh
        run: |
          function Publish($dir, $selfContained) {
            msbuild FluentLegionToolbar.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=$selfContained /p:PublishDir="$dir/"
            if($LASTEXITCODE -ne 0) { throw "Build failed: $dir" }
            $buildDir=Join-Path $PWD 'bin/x64/Release/net8.0-windows10.0.19041.0/win-x64'
            Get-ChildItem $buildDir -Recurse -Include *.xbf,*.pri | ForEach-Object {
              $relative=$_.FullName.Substring($buildDir.Length+1)
              $destination=Join-Path (Join-Path $PWD $dir) $relative
              New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
              Copy-Item $_.FullName $destination -Force
            }
            if(-not(Test-Path "$dir/MainWindow.xbf")) { throw "Compiled XAML missing in $dir" }
          }
          Publish 'out-fd' 'false'
          Remove-Item -Recurse -Force obj, bin
          Publish 'out-sc' 'true'
      - name: Capture compact UI fixtures
        shell: pwsh
        run: |
          foreach($language in @('english','arabic')) {
            foreach($theme in @('light','dark')) {
              $arguments=@('--capture',(Join-Path $PWD "$language-$theme.png"),"--$theme")
              if($language -eq 'arabic') { $arguments += '--arabic' }
              $p=Start-Process .\out-fd\FluentLegionToolbar.exe -ArgumentList $arguments -PassThru
              for($attempt=0;$attempt -lt 40;$attempt++) {
                $p.Refresh()
                if($p.HasExited) { Get-Content .\out-fd\launch-error.txt -ErrorAction SilentlyContinue; throw "Capture app exited early with $($p.ExitCode)" }
                if($p.MainWindowHandle -ne 0) { break }
                Start-Sleep -Milliseconds 250
              }
              Add-Type -AssemblyName System.Drawing
              if(-not ('WindowCaptureBounds' -as [type])) {
                Add-Type @'
          using System; using System.Runtime.InteropServices;
          public class WindowCaptureBounds {
            [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out Rect r);
          }
          '@
              }
              $p.Refresh()
              $rect = New-Object WindowCaptureBounds+Rect
              if($p.MainWindowHandle -ne 0 -and [WindowCaptureBounds]::GetWindowRect($p.MainWindowHandle, [ref]$rect)) {
                $bitmap = New-Object System.Drawing.Bitmap ($rect.Right-$rect.Left),($rect.Bottom-$rect.Top)
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                $graphics.CopyFromScreen($rect.Left,$rect.Top,0,0,$bitmap.Size)
                $bitmap.Save((Join-Path $PWD "window-$language-$theme.png"),[System.Drawing.Imaging.ImageFormat]::Png)
                $graphics.Dispose(); $bitmap.Dispose()
              } else { throw 'Actual window screenshot handle unavailable' }
              if(-not $p.WaitForExit(90000)) { Stop-Process $p.Id -Force; throw 'Capture timeout' }
              if($p.ExitCode -ne 0 -or -not (Test-Path "$language-$theme.png")) { throw 'Capture failed' }
            }
          }
      - name: Capture actual desktop interactive resize sequences
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          New-Item -ItemType Directory -Force interactive-frames | Out-Null
          $screen=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $p=Start-Process .\out-fd\FluentLegionToolbar.exe -ArgumentList '--capture',"$PWD/interactive-dark.png",'--dark','--interactive' -PassThru
          $clock=[Diagnostics.Stopwatch]::StartNew()
          $n=0
          while(-not $p.HasExited -and $clock.Elapsed.TotalSeconds -lt 100) {
            $bitmap=New-Object System.Drawing.Bitmap $screen.Width,$screen.Height
            $g=[System.Drawing.Graphics]::FromImage($bitmap)
            $g.CopyFromScreen($screen.X,$screen.Y,0,0,$bitmap.Size)
            $bitmap.Save((Join-Path $PWD ('interactive-frames/frame-{0:D5}.png' -f $n)),[System.Drawing.Imaging.ImageFormat]::Png)
            "$n,$($clock.Elapsed.TotalMilliseconds)" | Add-Content interactive-frames/times.csv
            $g.Dispose();$bitmap.Dispose();$n++
            Start-Sleep -Milliseconds 30
            $p.Refresh()
          }
          if(-not $p.HasExited){Stop-Process $p.Id -Force;throw 'Interactive sequence timed out'}
          if($p.ExitCode -ne 0){Get-Content out-fd/launch-error.txt -ErrorAction SilentlyContinue;throw 'Interactive sequence failed'}
          Get-Content interactive-phases.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-ui-captures
          path: |
            *-light.png
            *-dark.png
            out-fd/launch-error.txt
            layout-*.txt
            interactive-phases.txt
            interactive-frames/
      - name: Package (zip + installers)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive out-fd/* "release/FluentVantageToolbar-$v-portable-x64.zip"
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss /DSourceDir=out-fd /DOutName=FluentVantageToolbar-Setup /DBundled=0
          if($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          & $iscc installer.iss /DSourceDir=out-sc /DOutName=FluentVantageToolbar-Setup-with-dotnet /DBundled=1
          if($LASTEXITCODE -ne 0) { throw 'Bundled installer build failed' }
          Move-Item installers/FluentVantageToolbar-Setup.exe "release/FluentVantageToolbar-$v-Setup.exe"
          Move-Item installers/FluentVantageToolbar-Setup-with-dotnet.exe "release/FluentVantageToolbar-$v-Setup-with-dotnet.exe"
          Get-ChildItem release | Select-Object Name,Length
      - name: Verify upgrade closes running previous toolbar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.2 --pattern '*-portable-x64.zip' --dir previous
          if($LASTEXITCODE -ne 0) { throw 'Could not get previous release for upgrade test' }
          Expand-Archive (Get-ChildItem previous/*.zip).FullName previous/app
          $old=Get-ChildItem previous/app -Recurse -Filter FluentLegionToolbar.exe | Select-Object -First 1
          $dest=Join-Path $env:RUNNER_TEMP 'toolbar-upgrade-test'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item (Join-Path $old.Directory.FullName '*') $dest -Recurse -Force
          $running=Start-Process (Join-Path $dest 'FluentLegionToolbar.exe') -ArgumentList '--no-elevate','--show' -PassThru
          Start-Sleep -Seconds 4
          if($running.HasExited){throw 'Previous toolbar failed to start: cannot claim upgrade verified'}
          $setup=Get-ChildItem release/*Setup-with-dotnet.exe | Select-Object -First 1
          $log=Join-Path $PWD 'upgrade-test.log'
          $install=Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=',"/DIR=$dest", "/LOG=$log" -Wait -PassThru
          $running.Refresh()
          if($install.ExitCode -ne 0 -or -not $running.HasExited){throw 'Upgrade did not close old instance and install successfully'}
          $new=Start-Process (Join-Path $dest 'FluentLegionToolbar.exe') -ArgumentList '--no-elevate','--show' -PassThru
          Start-Sleep -Seconds 4
          if($new.HasExited){throw 'Updated toolbar failed to start'}
          Stop-Process -Id $new.Id -Force
          Write-Host 'PASS: running previous app closed, silent upgrade completed, new app launched'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-test-log
          path: upgrade-test.log
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $tag = "v$v"
          gh release view $tag *> $null
          $replace = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.replace_v037 }}' -eq 'true' -and $v -eq '0.3.7'
          if($LASTEXITCODE -eq 0 -and -not $replace) { throw "Release $tag already exists. Bump the version before publishing; old releases are immutable." }
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if($existingTag -and -not $replace) { throw "Tag $tag already exists. Choose a fresh version; old tags are immutable." }
          $notes = @"
          ## What's new in 0.3.7
          - Fixed blank black frames when reopening from the tray by keeping the window composed while hidden (DWM cloaking).
          - Restored the v0.3.5 show/hide slide and fade (42px, 220ms show / 170ms hide), Mica backdrop, and 12px taskbar gap. Native resizing stays instant; page content keeps its fade/rise animation.
          - Updates is last in Settings; About uses "GitHub Repo Link".
          - Fixed custom-accent hover colors and the healthy-battery color.
          - Installers create desktop and Start menu shortcuts.
          - Added the thermal tile: Quiet, Balanced and Performance, with the requested icons. Startup only reads the current mode; clicks cycle it. Performance requires AC power. Thermal replaces Fn Lock by default; Fn Lock remains available in Settings.
          - Replaced elevated native drag/drop (which can crash WinUI) with a Reorder/Done mode and in-app pointer drag handles. Normal mode keeps the visibility toggles; order is saved.

          ## Validation and limits
          - CI desktop checks covered English/Arabic, light/dark, navigation and 80 additional tray reopens: 3,417 captured frames, no black windows or broad black strips at DPI 96.
          - Thermal mappings and read-only startup code were checked in CI. The owner confirmed thermal mode cycling works on his physical Legion. Other models still need device testing.
          - Actual injected mouse press/move/release reordered rows down and back in all four combinations while running as administrator. Order serialization passed; a real-device restart check remains pending.
          - Installer shortcut and upgrade checks run in CI. Not install-tested on every Legion/LOQ model or GPU/DPI combination.

          ## Downloads
          - FluentVantageToolbar-$v-portable-x64.zip: portable, requires .NET 8 Desktop Runtime.
          - FluentVantageToolbar-$v-Setup.exe: small installer, requires .NET 8 Desktop Runtime.
          - FluentVantageToolbar-$v-Setup-with-dotnet.exe: installer with .NET bundled.

          Built from commit ${{ github.sha }}.
          "@
          if($replace) {
            gh release upload $tag (Get-ChildItem release).FullName --clobber
            if($LASTEXITCODE -ne 0) { throw '0.3.7 asset replacement failed' }
            git tag -f $tag ${{ github.sha }}
            git push origin "refs/tags/$tag" --force
            if($LASTEXITCODE -ne 0) { throw '0.3.7 tag update failed' }
            gh release edit $tag --notes $notes --title "Fluent Vantage Toolbar $v"
            if($LASTEXITCODE -ne 0) { throw '0.3.7 notes update failed' }
          } else {
            gh release create $tag (Get-ChildItem release).FullName --target ${{ github.sha }} --title "Fluent Vantage Toolbar $v" --notes $notes
            if($LASTEXITCODE -ne 0) { throw 'Release failed' }
          }
