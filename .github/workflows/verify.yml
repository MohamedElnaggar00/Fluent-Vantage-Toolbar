name: Verify private WinUI build
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  import:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - shell: pwsh
        run: |
          msbuild FluentLegionToolbar.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=false /p:PublishDir=out/
          if($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $buildDir=Join-Path $PWD 'bin/x64/Release/net8.0-windows10.0.19041.0/win-x64'
          Get-ChildItem $buildDir -Recurse -Include *.xbf,*.pri | ForEach-Object {
            $relative=$_.FullName.Substring($buildDir.Length+1)
            $destination=Join-Path (Join-Path $PWD 'out') $relative
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $_.FullName $destination -Force
          }
          Get-ChildItem out -Recurse -Include *.xbf,*.pri | Select-Object FullName,Length
          if(-not(Test-Path out/MainWindow.xbf)) { throw 'Compiled window XAML missing from published payload' }

          foreach($language in @('english','arabic')) {
            foreach($theme in @('light','dark')) {
              Write-Host "CAPTURE BEGIN $language $theme $(Get-Date -Format o)"
              $arguments=@('--capture',(Join-Path $PWD "$language-$theme.png"),"--$theme")
              if($language -eq 'arabic') { $arguments += '--arabic' }
              $p=Start-Process .\out\FluentLegionToolbar.exe -ArgumentList $arguments -PassThru
              for($attempt=0;$attempt -lt 40;$attempt++) {
                $p.Refresh()
                if($p.HasExited) { Get-Content .\out\launch-error.txt -ErrorAction SilentlyContinue; throw "Capture app exited early with $($p.ExitCode)" }
                if($p.MainWindowHandle -ne 0) { break }
                Start-Sleep -Milliseconds 250
              }
              Add-Type -AssemblyName System.Drawing
              if(-not ('WindowCaptureBounds' -as [type])) {
                Add-Type @'
          using System; using System.Runtime.InteropServices;
          public class WindowCaptureBounds {
            [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out Rect r);
          }
          '@
              }
              $p.Refresh()
              $rect = New-Object WindowCaptureBounds+Rect
              if($p.MainWindowHandle -ne 0 -and [WindowCaptureBounds]::GetWindowRect($p.MainWindowHandle, [ref]$rect)) {
                $bitmap = New-Object System.Drawing.Bitmap ($rect.Right-$rect.Left),($rect.Bottom-$rect.Top)
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                $graphics.CopyFromScreen($rect.Left,$rect.Top,0,0,$bitmap.Size)
                $bitmap.Save((Join-Path $PWD "window-$language-$theme.png"),[System.Drawing.Imaging.ImageFormat]::Png)
                $graphics.Dispose(); $bitmap.Dispose()
              } else { throw 'Actual window screenshot handle unavailable' }
              if(-not $p.WaitForExit(180000)) { Stop-Process $p.Id -Force; throw 'Capture timeout' }
              if($p.ExitCode -ne 0 -or -not (Test-Path "$language-$theme.png")) { throw 'Capture failed' }
              Write-Host "CAPTURE END $language $theme $(Get-Date -Format o)"
            }
          }
      - name: Capture actual update cards
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          New-Item -ItemType Directory -Force update-desktop | Out-Null
          foreach($language in @('english','arabic')) { foreach($theme in @('light','dark')) { foreach($state in @('current','available','checking','error')) { foreach($page in @('about','settings')) {
            $name="$language-$theme-$state-$page"
            $path=Join-Path $PWD "update-desktop/$name.png"
            $arguments=@('--capture',$path,'--updates-only','--update-state',$state,"--$theme")
            if($language -eq 'arabic'){$arguments+='--arabic'}
            if($page -eq 'settings'){$arguments+='--updates-settings'}
            $p=Start-Process .\out\FluentLegionToolbar.exe -ArgumentList $arguments -PassThru
            $clock=[Diagnostics.Stopwatch]::StartNew()
            while(-not(Test-Path "$path.ready") -and -not $p.HasExited -and $clock.Elapsed.TotalSeconds -lt 30){Start-Sleep -Milliseconds 200;$p.Refresh()}
            if(-not(Test-Path "$path.ready")){throw 'Update card not ready'}
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bitmap);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bitmap.Save($path);$g.Dispose();$bitmap.Dispose();Stop-Process $p.Id -Force
          }}}}
      - name: Capture actual desktop interactive resize sequences
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          New-Item -ItemType Directory -Force interactive-frames | Out-Null
          $screen=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          foreach($language in @('english','arabic')) { foreach($theme in @('light','dark')) {
          $captureDir=Join-Path $PWD "interactive-$language-$theme"
          New-Item -ItemType Directory -Force $captureDir | Out-Null
          $framesDir=Join-Path $captureDir 'frames'
          New-Item -ItemType Directory -Force $framesDir | Out-Null
          $arguments=@('--capture',"$captureDir/main.png","--$theme",'--interactive')
          if($language -eq 'arabic') { $arguments += '--arabic' }
          $p=Start-Process .\out\FluentLegionToolbar.exe -ArgumentList $arguments -PassThru
          $clock=[Diagnostics.Stopwatch]::StartNew()
          $n=0
          while(-not $p.HasExited -and $clock.Elapsed.TotalSeconds -lt 240) {
            $bitmap=New-Object System.Drawing.Bitmap $screen.Width,$screen.Height
            $g=[System.Drawing.Graphics]::FromImage($bitmap)
            $g.CopyFromScreen($screen.X,$screen.Y,0,0,$bitmap.Size)
            $bitmap.Save((Join-Path $framesDir ('frame-{0:D5}.png' -f $n)),[System.Drawing.Imaging.ImageFormat]::Png)
            "$n,$($clock.Elapsed.TotalMilliseconds)" | Add-Content (Join-Path $framesDir times.csv)
            $g.Dispose();$bitmap.Dispose();$n++
            Start-Sleep -Milliseconds 30
            $p.Refresh()
          }
          if(-not $p.HasExited){Stop-Process $p.Id -Force;throw 'Interactive sequence timed out'}
          if($p.ExitCode -ne 0){Get-Content out/launch-error.txt -ErrorAction SilentlyContinue;throw 'Interactive sequence failed'}
          Get-Content (Join-Path $captureDir interactive-phases.txt)
          }}
      - name: Verify installer shortcuts without startup task
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss /DSourceDir=out /DOutName=ShortcutTest /DBundled=1
          if($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $destination=Join-Path $env:RUNNER_TEMP 'VantageShortcutTest'
          $p=Start-Process .\installers\ShortcutTest.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=""',"/DIR=$destination" -Wait -PassThru
          if($p.ExitCode -ne 0) { throw 'Silent installer failed' }
          $shell=New-Object -ComObject WScript.Shell
          foreach($directory in @([Environment]::GetFolderPath('CommonDesktopDirectory'),[Environment]::GetFolderPath('CommonPrograms'))) {
            $link=Join-Path $directory 'Fluent Vantage Toolbar.lnk'
            if(-not(Test-Path $link)) { throw "Missing shortcut: $link" }
            $shortcut=$shell.CreateShortcut($link)
            if($shortcut.TargetPath -ne (Join-Path $destination 'FluentLegionToolbar.exe') -or $shortcut.Arguments -ne '--show') { throw "Wrong shortcut target: $link" }
            "$link -> $($shortcut.TargetPath) $($shortcut.Arguments)" | Add-Content installer-shortcuts.txt
          }
          Get-Content installer-shortcuts.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-test-build-and-captures
          path: |
            update-desktop/
            out/
            *.png
            **/layout-*.txt
            interactive-phases.txt
            navigation-geometry.csv
            navigation-native-bounds.csv
            installer-shortcuts.txt
            interactive-frames/
            interactive-*/
