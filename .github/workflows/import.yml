name: Import private source
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  import:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/hotfix-0.3.8' && contains(github.event.head_commit.message, 'Import source')
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $zip=Get-ChildItem *legion-source.zip | Sort-Object Name | Select-Object -Last 1
          if(-not $zip) { throw 'No source bundle' }
          Expand-Archive $zip.FullName -DestinationPath . -Force
          Remove-Item *legion-source.zip
          git config user.name 'Mohamed Elnaggar'
          git config user.email 'MohamedElnaggar00@users.noreply.github.com'
          git add .
          git commit -m 'Unpack private WinUI source'
          git push
