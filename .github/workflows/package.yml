name: Verify hotfix installer
on:
  push:
    branches: [hotfix-0.3.8]
    paths: ['.github/workflows/package.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hotfix-distribution
          run-id: 37991309496
          github-token: ${{ github.token }}
          path: release
      - name: Capture installer and test runtime paths
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;using System.Runtime.InteropServices;
          public class CaptureSetup {
          public delegate bool Callback(IntPtr h,IntPtr l);
          [DllImport("user32.dll")] public static extern bool EnumWindows(Callback c,IntPtr l);
          [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint p);
          [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h,int n);
          [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out Rect r);
          [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h,IntPtr z,int x,int y,int w,int t,uint f);
          [StructLayout(LayoutKind.Sequential)] public struct Rect{public int L,T,R,B;}
          }
          '@
          $setup=Get-ChildItem release/*-Setup.exe | Select-Object -First 1
          foreach($mode in @('present','missing')) {
            $root=Join-Path $env:ProgramFiles 'dotnet/shared/Microsoft.NETCore.App'
            $moved=@()
            if($mode -eq 'missing') {Get-ChildItem $root -Directory | Where-Object {$_.Name -like '8.*'} | ForEach-Object {Rename-Item $_.FullName ('hidden-'+$_.Name);$moved+=$_.Name}}
            try {
              $p=Start-Process $setup.FullName -PassThru
              Start-Sleep -Seconds 5
              $script:handles=@()
              [CaptureSetup]::EnumWindows({param($h,$l) $owner=0;[CaptureSetup]::GetWindowThreadProcessId($h,[ref]$owner)|Out-Null;if([CaptureSetup]::IsWindowVisible($h)){ $proc=Get-Process -Id $owner -ErrorAction SilentlyContinue;if($proc -and $proc.ProcessName -like '*Setup*'){$script:handles+=$h}};return $true},[IntPtr]::Zero)|Out-Null
              if(-not $handles){throw 'Installer window not found'}
              $h=[IntPtr]::Zero
              foreach($candidate in $handles){$rect=New-Object CaptureSetup+Rect;if([CaptureSetup]::GetWindowRect([IntPtr]$candidate,[ref]$rect) -and ($rect.R-$rect.L) -gt 100 -and ($rect.B-$rect.T) -gt 100){$h=[IntPtr]$candidate;$r=$rect}}
              if($h -eq [IntPtr]::Zero){throw 'No sized installer window found'}
              [CaptureSetup]::ShowWindow($h,9)|Out-Null;[CaptureSetup]::SetWindowPos($h,[IntPtr](-1),0,0,0,0,0x0043)|Out-Null;[CaptureSetup]::SetForegroundWindow($h)|Out-Null
              Start-Sleep -Seconds 1
              $bmp=New-Object Drawing.Bitmap ($r.R-$r.L),($r.B-$r.T);$g=[Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($r.L,$r.T,0,0,$bmp.Size);$bmp.Save((Join-Path $PWD "installer-$mode.png"));$g.Dispose();$bmp.Dispose()
            } finally {
              Get-Process | Where-Object {$_.ProcessName -like '*Setup*'} | Stop-Process -Force -ErrorAction SilentlyContinue
              foreach($name in $moved){Rename-Item (Join-Path $root ('hidden-'+$name)) $name}
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-verified-pixels
          path: installer-*.png
